name: quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/environment-setup]
permissions:
  contents: read
jobs:
  policy-and-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate policy
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python scripts/check_repository.py --ci
          if [ -n "$HEAD_BRANCH" ]; then
            python -c 'import os; from scripts.check_repository import BRANCH, check_subject; assert BRANCH.fullmatch(os.environ["HEAD_BRANCH"]), "Invalid branch"; check_subject(os.environ["PR_TITLE"])'
          fi
      - name: Scan complete history and archives
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner --max-archive-depth=3 --log-opts="--all"
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finca_ci
          POSTGRES_USER: finca_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finca_ci -d finca_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://finca_ci:ephemeral-ci-only@localhost:5432/finca_ci
      DJANGO_SECRET_KEY: ci-only-placeholder-never-use-in-production
      DJANGO_DEBUG: 'False'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: pip install -r apps/api/requirements-dev.txt
      - run: ruff check apps/api scripts
      - run: ruff format --check apps/api scripts
      - run: python apps/api/manage.py check
      - run: python apps/api/manage.py makemigrations --check --dry-run
      - run: pytest apps/api
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/audit-dependencies.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify workforce rules and transactions on isolated Firebase emulators
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-workforce-security --config ../../firebase/emulators.json --only firestore,storage "npm run test:firestore"

  workforce-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r apps/api/requirements-dev.txt
      - name: Install browser QA tools
        working-directory: apps/web
        run: |
          npm install --global npm@11.19.0
          npm ci
          npx playwright install --with-deps chromium
      - name: Test complete day against isolated synthetic database
        working-directory: apps/web
        run: npm run test:e2e
      - name: Test Firebase operational flow in desktop and mobile browsers
        working-directory: apps/web
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          NEXT_PUBLIC_DATA_SOURCE=firebase NEXT_PUBLIC_API_URL='' NEXT_PUBLIC_FIREBASE_EMULATORS=1 npm run dev -- --hostname 127.0.0.1 --port 3004 > /tmp/workforce-next.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          node -e 'for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:3004/login")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)' --input-type=module
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-workforce-browser --config ../../firebase/emulators.json --only firestore,auth,storage "npm run test:firebase-browser"
